name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 零第三方依赖自检
        run: python -c "import agentlab, sys; print('agentlab', agentlab.__version__, '| deps:', [m for m in ('openai','langchain','numpy','chromadb') if m in sys.modules] or 'none')"

      - name: 单元测试
        run: python -m pytest tests -q

      - name: 评测集（必须全绿）
        run: python -m agentlab eval --out reports

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 严格编译检查
        run: python -m compileall -q agentlab tests

      - name: 依赖检查（运行时零依赖；测试只允许 pytest）
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          # agentlab/ 是发布出去的运行时，必须只依赖标准库；
          # tests/ 允许 pytest，但仍禁止偷偷引入真实模型/向量库把测试喂饱。
          runtime_forbidden = {
              "openai", "anthropic", "langchain", "langchain_core", "llama_index",
              "numpy", "pandas", "scipy", "sklearn", "torch", "chromadb",
              "requests", "httpx", "aiohttp", "pydantic", "click", "typer",
              "rich", "tqdm", "yaml", "dotenv",
          }
          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          base_allowed = stdlib | {"agentlab", "__future__"}

          def is_bad(root: str, is_test: bool) -> bool:
              if is_test and root in ("pytest", "conftest"):
                  return False
              if stdlib:  # Python >= 3.10 有权威标准库名单
                  return root not in base_allowed
              return root in runtime_forbidden  # 旧解释器退化为禁止名单

          bad, runtime_files, test_files = [], [], []
          for path in sorted(pathlib.Path("agentlab").rglob("*.py")):
              runtime_files.append(path)
          for path in sorted(pathlib.Path("tests").rglob("*.py")):
              test_files.append(path)

          for path, is_test in [(p, False) for p in runtime_files] + [(p, True) for p in test_files]:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if is_bad(alias.name.split(".")[0], is_test):
                              bad.append(f"{path}: import {alias.name}")
                  elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      if is_bad(node.module.split(".")[0], is_test):
                          bad.append(f"{path}: from {node.module}")
          if bad:
              print("\n".join(bad))
              raise SystemExit("依赖检查未通过")
          print(f"依赖检查通过：运行时 {len(runtime_files)} 个文件仅用标准库；"
                f"测试 {len(test_files)} 个文件仅用 pytest")
          PY

      - name: CLI 冒烟
        run: |
          python -m agentlab tools > /dev/null
          python -m agentlab run "查一下 cnc-03 的温度指标" > /dev/null
          python -m agentlab demo > /dev/null
